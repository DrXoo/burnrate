server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, so a backend container restart (new IP) is picked up
    # instead of being cached for the lifetime of this nginx process. This pins
    # the file to docker-compose: proxy_pass through a variable resolves per
    # request, so on a runtime without 127.0.0.11 every proxied request fails.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $burnrate_backend "http://backend:8000";

    # --- Shared by both proxied locations ------------------------------------
    # Set at server level because proxy_set_header is inherited by any location
    # that does not redefine it, which keeps the two blocks below from drifting.
    proxy_http_version 1.1;
    # $http_host, not $host: $host drops the port, so a Starlette redirect built
    # from the request URL (redirect_slashes is on by default) would point the
    # browser at :80 rather than the published port.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr, not $proxy_add_x_forwarded_for: the latter *appends* to whatever
    # the client sent, and uvicorn's --forwarded-allow-ips "*" trusts the leftmost
    # entry -- so a request carrying its own X-Forwarded-For set request.client.host
    # to any value it liked, and the login lockout and the bank rate limiter both key
    # on that address. Overwriting makes this header mean "the address nginx accepted
    # the connection from" and nothing else. nginx is the only hop, so there is no
    # upstream chain to preserve; putting another proxy in front of it would need that
    # proxy's forwarded address trusted here explicitly, not this header appended to.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An Enable Banking sync pages serially over upstream HTTP and routinely runs
    # past nginx's 60s read default, which returned a 504 to the browser while the
    # import went on to commit -- the owner saw a failure and retried a sync that
    # had actually worked, burning the rate-limit bucket.
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # The backend sets its own copy of these four on every API response
    # (api/security_headers.py), and add_header appends rather than replaces, so
    # without hiding the upstream's copy every proxied response carried each header
    # twice -- and two Cross-Origin-Opener-Policy values do not parse as a structured
    # field, which degrades the policy to unsafe-none. Hiding them here rather than
    # scoping add_header to `location /` is what keeps nginx's *own* responses
    # covered: a 502 from a stopped backend, a 504 from the read timeout, or any error
    # nginx emits while matching a proxied location never reaches the backend
    # middleware, so a header set only on the SPA location left those bare.
    # proxy_hide_header is inherited by every location, like the proxy_set_headers
    # above, so there is one place to change and nothing to keep in sync.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;

    # --- Security headers, on every response this server emits ---------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content-Security-Policy. script-src is strict ('self' only) which is the
    # main XSS defense. style-src allows inline because the UI uses React
    # inline styles, plus Google Fonts. connect-src is 'self' because the API
    # is proxied under this origin, so the app never needs a cross-origin
    # fetch -- that is the security win the proxy buys, and it replaces the
    # broad http:/https: this carried while the API base was a runtime guess.
    # The backend deliberately sets no CSP of its own, so this is the only one.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # HSTS is honored only over https and is a no-op (or foot-gun) over http.
    # Enable it on the TLS-terminating proxy, or here if the deployment is
    # https end-to-end:
    # add_header Strict-Transport-Security "max-age=15768000" always;

    # Proxy the API under the same origin as the UI. This is what keeps the
    # deployment portable: the browser only ever talks to whatever host/port it
    # loaded the page from, so a VM IP change or a new proxy hostname needs no
    # config anywhere (and no CORS, since nothing is cross-origin).
    location /api/v1/ {
        proxy_pass $burnrate_backend$request_uri;
    }

    # The bank sends the user back to ENABLE_BANKING_REDIRECT_URL, which points
    # at the public hostname (this server), not at the backend port. Forward it
    # so the callback is handled instead of falling through to index.html.
    location /enable_banking_items/ {
        proxy_pass $burnrate_backend$request_uri;
    }

    # Single-page app: unknown paths fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
