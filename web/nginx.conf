server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (applied to every response via `always`) -----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content-Security-Policy. script-src is strict ('self' only) which is the
    # main XSS defense. style-src allows inline because the UI uses React inline
    # styles, plus Google Fonts. connect-src stays broad (http:/https:) because
    # the API base is detected at runtime and may sit on another port/host
    # (e.g. :8000 on the LAN); tighten it to your exact API origin once the
    # deployment URL is fixed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # HSTS is honored only over https and is a no-op (or foot-gun) over http.
    # Enable it on the TLS-terminating proxy, or here if the deployment is https
    # end-to-end:
    # add_header Strict-Transport-Security "max-age=15768000" always;

    # Single-page app: unknown paths fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
