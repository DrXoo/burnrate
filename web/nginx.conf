server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (applied to every response via `always`) -----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Content-Security-Policy. script-src is strict ('self' only) which is the
    # main XSS defense. style-src allows inline because the UI uses React inline
    # styles, plus Google Fonts. connect-src stays broad (http:/https:) because
    # the API base is detected at runtime and may sit on another port/host
    # (e.g. :8000 on the LAN); tighten it to your exact API origin once the
    # deployment URL is fixed.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # HSTS is honored only over https and is a no-op (or foot-gun) over http.
    # Enable it on the TLS-terminating proxy, or here if the deployment is https
    # end-to-end:
    # add_header Strict-Transport-Security "max-age=15768000" always;

    # Docker's embedded DNS, so a backend container restart (new IP) is picked up
    # instead of being cached for the lifetime of this nginx process.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $burnrate_backend "http://backend:8000";

    # Proxy the API under the same origin as the UI. This is what keeps the
    # deployment portable: the browser only ever talks to whatever host/port it
    # loaded the page from, so a VM IP change or a new proxy hostname needs no
    # config anywhere (and no CORS, since nothing is cross-origin).
    location /api/v1/ {
        proxy_pass $burnrate_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The bank sends the user back to ENABLE_BANKING_REDIRECT_URL, which points
    # at the public hostname (this server), not at the backend port. Forward it
    # so the callback is handled instead of falling through to index.html.
    location /enable_banking_items/ {
        proxy_pass $burnrate_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown paths fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
