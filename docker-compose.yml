services:
  postgres:
    image: postgres:17-alpine
    container_name: burnrate-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Deliberately NOT published to the host: the database holds the full
    # financial history and is reachable by the app over the compose network as
    # "postgres:5432". Publishing it would expose it to the LAN. To inspect it,
    # use `docker compose exec postgres psql -U $POSTGRES_USER $POSTGRES_DB`.
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: burnrate-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  sync-worker:
    build:
      context: ./backend
    container_name: burnrate-sync-worker
    command: ["python", "-m", "burnrate.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot:
    build:
      context: ./backend
    container_name: burnrate-telegram-bot
    command: ["python", "-m", "burnrate.telegram_bot"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    container_name: burnrate-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
