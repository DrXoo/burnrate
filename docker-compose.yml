services:
  postgres:
    image: postgres:17-alpine
    container_name: burnrate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Deliberately NOT published to the host: the database holds the full
    # financial history and is reachable by the app over the compose network as
    # "postgres:5432". Publishing it would expose it to the LAN. To inspect it,
    # use `docker compose exec postgres psql -U $POSTGRES_USER $POSTGRES_DB`.
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: burnrate-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      # Bound to the loopback interface: nginx reaches the backend over the
      # compose network, so publishing this to the LAN only offered a path that
      # bypasses the proxy -- and with --forwarded-allow-ips it would have let
      # anyone on the LAN spoof X-Forwarded-For past both rate limiters. Spoofing
      # *through* nginx is a separate hole, closed separately by overwriting that
      # header in web/nginx.conf. Local `vite dev` still reaches it on 127.0.0.1.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  sync-worker:
    build:
      context: ./backend
    container_name: burnrate-sync-worker
    restart: unless-stopped
    command: ["python", "-m", "burnrate.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot:
    build:
      context: ./backend
    container_name: burnrate-telegram-bot
    # The bot polls a third-party API forever, so it is the service most likely
    # to be killed by something transient -- a 429 on getUpdates ended it once,
    # and it stayed dead for 21 hours because nothing brought it back. The
    # polling loop now survives that class of rejection; this is the backstop
    # for the crash we have not thought of yet.
    restart: unless-stopped
    command: ["python", "-m", "burnrate.telegram_bot"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    container_name: burnrate-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
      # The bank will only redirect to an https URL, so this port is what makes
      # reconnecting a bank possible at all. See docs/technical/deployment.md.
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # Shared with `acme`, which writes the certificate here. Read by nginx at
      # startup and on every reload.
      - tls-certs:/etc/nginx/certs
    depends_on:
      - backend

  # Issues and renews the TLS certificate over DNS-01, which proves control of the
  # domain through a TXT record instead of an inbound connection. That is the whole
  # reason for choosing it: no port has to be reachable from the internet for the
  # certificate to be obtained, so it can be issued from anywhere and before the
  # machine is ever exposed.
  #
  # Not started with the stack: `profiles` keeps it out of `docker compose up`. It
  # runs on demand to issue, and in `daemon` mode to renew. See the deployment doc.
  acme:
    image: neilpang/acme.sh:3.0.7
    container_name: burnrate-acme
    profiles: ["certs"]
    environment:
      # DuckDNS's own API token, which is what authorizes writing the TXT record.
      # Left empty rather than required with `:?`, which would make *every* compose
      # command fail until the token exists -- including bringing up the database.
      # An absent token fails inside acme.sh, where the error is about the one thing
      # that needs it.
      DuckDNS_Token: ${DUCKDNS_TOKEN:-}
    volumes:
      - acme-state:/acme.sh
      - tls-certs:/certs

volumes:
  postgres-data:
  # acme.sh's account key and issued certificates. Losing it means re-registering
  # with the CA, which is cheap, but it also holds the renewal schedule.
  acme-state:
  # The pair nginx serves. Named rather than a bind mount so the private key is not
  # sitting in the repo directory, where a stray `git add -A` could reach it.
  tls-certs:
